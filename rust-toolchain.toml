# Pinned so mac, Linux and Windows build TxUI with the same compiler.
#
# 1.94 is the floor: sqlx 0.9 requires it, and sqlx 0.9 is what allows
# libsqlite3-sys 0.37 and therefore SQLite 3.51.3 (see docs/SQLITE_PRAGMAS.md
# §1 — the app carries its own SQLite, so the dependency chain decides which
# version reads every .db file the user opens).
#
# Pinned rather than "stable" because the SQLite that ships inside the binary
# should not change because a build machine happened to update.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]

# Pinned so mac, Linux and Windows build TxUI with the same compiler.
#
# 1.94 is the floor: sqlx 0.9 requires it. The patched sqlx-sqlite dependency
# admits libsqlite3-sys 0.39 and therefore SQLite 3.54.1 (see
# docs/SQLITE_PRAGMAS.md §1 — the app carries its own SQLite, so the dependency
# chain decides which version reads every .db file the user opens).
#
# Pinned rather than "stable" because the SQLite that ships inside the binary
# should not change because a build machine happened to update.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]

# Canonical copy: crossbuild/ci/release.yml
# Installed at .github/workflows/release.yml — keep the two identical.
#
# Release pipeline: all three platforms, every tag, no local machine needed.
#   git tag v0.58.0 && git push --tags   →  draft GitHub Release with:
#   macOS universal .dmg/.app · Linux AppImage + .deb · Windows NSIS + MSI
#
# Re-pushing a tag whose release is already PUBLISHED skips the whole matrix
# (guard job below) — an accidental re-tag must not rebuild the world.
#
# Also runs manually (Actions → Release → Run workflow) — artifacts are then
# uploaded as workflow artifacts instead of a release, for testing the pipe.
#
# Why ubuntu-22.04 for Linux: the AppImage/deb inherit the build machine's
# glibc floor. 22.04 (glibc 2.35) keeps the artifacts runnable on every live
# distro. Bumping the runner image is a product decision (see
# crossbuild/README.md, "glibc floor").
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Release and upload assets

jobs:
  # Cheap pre-flight (~30 s, Linux): does this tag already have a PUBLISHED
  # release? If yes, the matrix below is skipped entirely — re-pushing an old
  # tag (history rewrite, tag fix) then costs seconds, not a 3-OS rebuild.
  guard:
    runs-on: ubuntu-22.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq 'if .draft then "draft" else "published" end' 2>/dev/null || echo none)
          echo "existing release for $TAG: $state"
          if [ "$state" = "published" ]; then
            echo "::notice::Release $TAG already published — skipping matrix"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary (ARM + Intel in one bundle)
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin x86_64-apple-darwin'

          # Linux x86-64 — AppImage + .deb (glibc floor: 2.35)
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''

          # Windows x86-64 — NSIS installer + MSI (MSI needs real Windows)
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # ── Node ────────────────────────────────────────────────────────
      # v7 actions run natively on Node.js 24 (the runner default since
      # 2026-06); the v4 majors were Node 20 actions, removed from runners
      # on 2026-09-16. node-version 24 matches the app's dev toolchain
      # (Node 25 locally) far better than the old 20.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # ── Rust ────────────────────────────────────────────────────────
      # rust-toolchain.toml in the repo pins the actual compiler (1.97.1);
      # rustup auto-installs it on first use. The `stable` here is only a
      # bootstrap so rustup exists.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # The `targets` above land on the bootstrap `stable` toolchain, but
      # rust-toolchain.toml overrides the actual build to the pinned compiler
      # (1.97.1) — so the extra targets must be installed there too. Only the
      # macOS universal build needs a second architecture.
      - name: Install pinned-toolchain targets (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: |
          channel=$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --target aarch64-apple-darwin --target x86_64-apple-darwin --profile minimal

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: true

      # ── Linux system deps ────────────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # ── Frontend deps ────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      # ── Release notes: pull the matching section out of CHANGELOG ───
      # On a tag push the version is vX.Y.Z → the "## [X.Y.Z]" section; on a
      # manual run (no tag) it falls back to the "## [Unreleased]" section.
      # The result lands in RELEASE_BODY and becomes the GitHub Release body.
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          out=/tmp/txui-release-notes.md
          for pat in "## [$ver]" "## [Unreleased]"; do
            awk -v pat="$pat" '
              /^## \[/ {
                if (found) exit
                found = (index($0, pat) == 1)
                next
              }
              found
            ' CHANGELOG.md > "$out"
            [ -s "$out" ] && break
          done
          [ -s "$out" ] || printf 'See CHANGELOG.md for details.\n' > "$out"
          # Unwrap: the CHANGELOG is hard-wrapped at ~76 cols for terminals,
          # but GitHub renders single newlines as <br> — join continuation
          # lines so each note is one full-width line. Fence-aware: ```
          # code blocks pass through untouched.
          awk '
            /^```/ { fence = !fence }
            {
              if (fence) { flush(); print; next }
              if ($0 ~ /^[[:space:]]+[^[:space:]]/ && buf != "") {
                line = $0; gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                buf = buf " " line; next
              }
              flush()
              if ($0 ~ /^[[:space:]]*$/) { print ""; next }
              if ($0 ~ /^- /) { buf = $0; next }
              print
            }
            function flush() { if (buf != "") { print buf; buf = "" } }
            END { flush() }
          ' "$out" > "$out.unwrap" && mv "$out.unwrap" "$out"
          {
            echo 'RELEASE_BODY<<TXUI_NOTES_EOF'
            cat "$out"
            echo 'TXUI_NOTES_EOF'
          } >> "$GITHUB_ENV"

      # ── Build + publish ─────────────────────────────────────────────
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS signing is intentionally left unset: with no Apple developer
          # account the bundle is ad-hoc signed by Tauri (no certificate), so it
          # runs but users must right-click → Open the first time. To notarize
          # later, set these secrets and uncomment the six lines below.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

        with:
          # tagName/releaseName only apply on tag pushes; on manual runs the
          # action just builds and the upload step below captures artifacts.
          tagName: ${{ github.ref_name }}
          releaseName: 'TxUI ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true      # review before publishing
          prerelease: false
          args: ${{ matrix.args }}

      # Manual (non-tag) runs: expose the bundles as workflow artifacts.
      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: txui-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
